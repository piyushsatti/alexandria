name: Alexandria CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: alexandria-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check diff hygiene
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            python3 scripts/check_changes.py --base "$BEFORE"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Install check tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
          python3 -m venv "$RUNNER_TEMP/check-tools"
          "$RUNNER_TEMP/check-tools/bin/pip" install ruff==0.16.4

      - name: Check runtime formatting and lint
        run: |
          "$RUNNER_TEMP/check-tools/bin/ruff" format --check src tests scripts
          "$RUNNER_TEMP/check-tools/bin/ruff" check src tests scripts

      - name: Install Alexandria package
        run: python3 -m pip install --no-deps --editable .

      - name: Run runtime unit tests
        run: python3 -m unittest discover -s tests/pi/alexandria/runtime -p 'test_*.py' -v

      - name: Run Knowledge boundary checker tests
        run: python3 -m unittest tests/test_knowledge_boundary.py -v

      - name: Run structured provenance checker tests
        run: python3 -m unittest tests/test_structured_provenance.py -v

      - name: Run structured provenance review validator tests
        run: python3 -m unittest tests/test_provenance_review.py -v

      - name: Run authority review validator tests
        run: python3 -m unittest tests/test_authority_review.py -v

      - name: Run combined review bundle tests
        run: python3 -m unittest tests/test_review_bundle.py -v

      - name: Install locked graph test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix src/pi/alexandria/graph/assets/pi-trial

      - name: Run graph safety tests
        run: python3 -m unittest discover -s tests/pi/alexandria/graph -p 'test_*.py' -v

      - name: Run preservation contract tests
        run: node --test tests/pi/alexandria/graph/test_preservation*.mjs

      - name: Build code-only runtime image
        run: docker build --iidfile "$RUNNER_TEMP/alexandria-image" -f docker/Dockerfile .

      - name: Check image startup and dependency boundary
        run: |
          image=$(cat "$RUNNER_TEMP/alexandria-image")
          docker run --rm --network none "$image" --help
          docker run --rm --network none --entrypoint python "$image" -c 'import cryptography, fastembed, jwt, lancedb, mcp'
          docker run --rm --network none --entrypoint rg "$image" --version
