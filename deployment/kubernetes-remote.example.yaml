# TEMPLATE ONLY. Replace every REPLACE_WITH_* value before review/apply.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alexandria
  namespace: alexandria
  labels:
    app.kubernetes.io/name: alexandria
    app.kubernetes.io/version: "REPLACE_WITH_CALVER"
  annotations:
    application-revision: REPLACE_WITH_APPLICATION_REVISION
    indexed-revision: REPLACE_WITH_INDEXED_REVISION
    oci-index-digest: REPLACE_WITH_IMAGE_DIGEST
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alexandria
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alexandria
        app.kubernetes.io/version: "REPLACE_WITH_CALVER"
      annotations:
        application-revision: REPLACE_WITH_APPLICATION_REVISION
        indexed-revision: REPLACE_WITH_INDEXED_REVISION
        oci-index-digest: REPLACE_WITH_IMAGE_DIGEST
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: REPLACE_WITH_NODE_NAME
      restartPolicy: Always
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alexandria
          image: REPLACE_WITH_IMAGE_REFERENCE
          imagePullPolicy: Never
          args:
            - serve
            - --data
            - /opt/alexandria/data
            - --transport
            - streamable-http
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --issuer-url
            - REPLACE_WITH_ISSUER_URL
            - --resource-url
            - REPLACE_WITH_MCP_RESOURCE_URL
            - --jwks-url
            - http://127.0.0.1:8001/jwks.json
            - --required-scope
            - read:alexandria
          env:
            - name: ALEXANDRIA_ALLOWED_SUBJECTS
              value: REPLACE_WITH_ALLOWED_SUBJECTS
            - name: HF_HUB_OFFLINE
              value: "1"
          ports:
            - name: mcp
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          startupProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            - name: jwks
              mountPath: /etc/alexandria/jwks.json
              subPath: jwks.json
              readOnly: true
        - name: jwks
          image: REPLACE_WITH_IMAGE_REFERENCE
          imagePullPolicy: Never
          command:
            - python
            - -m
            - http.server
            - "8001"
            - --bind
            - 127.0.0.1
            - --directory
            - /jwks
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary-jwks
              mountPath: /tmp
            - name: jwks
              mountPath: /jwks
              readOnly: true
      volumes:
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: temporary-jwks
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: jwks
          configMap:
            name: alexandria
            items:
              - key: jwks.json
                path: jwks.json
---
apiVersion: v1
kind: Service
metadata:
  name: alexandria
  namespace: alexandria
  labels:
    app.kubernetes.io/name: alexandria
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: alexandria
  ports:
    - name: mcp
      protocol: TCP
      port: 8000
      targetPort: mcp
      nodePort: 30080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alexandria
  namespace: alexandria
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alexandria
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: REPLACE_WITH_GATEWAY_CIDR
      ports:
        - protocol: TCP
          port: 8000
