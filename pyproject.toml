[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-alexandria"
version = "2026.09.20"
description = "A stateless MCP runtime for versioned knowledge data blocks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "lancedb==0.39.0",
  "fastembed==0.8.0",
  "mcp==1.30.0",
  "PyJWT[crypto]==2.14.0",
]

[project.scripts]
alexandria = "pi.alexandria.runtime.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pi*"]
namespaces = true

[tool.setuptools.package-data]
"pi.alexandria" = ["py.typed"]
"pi.alexandria.graph" = [
  "assets/fixtures/*.md",
  "assets/fixtures/*.json",
  "assets/pi-trial/*.mjs",
  "assets/pi-trial/*.json",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff==0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "N", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
